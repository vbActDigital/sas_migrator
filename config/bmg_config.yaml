project:
  name: "SAS Migration - BMG"
  client: "BMG"

# ── Ambiente SAS (RHEL 7.9 / SAS 9.4) ────────────────────────
sas_environment:
  source_type: filesystem

  # Auto-discovery: o scanner percorre os diretórios abaixo
  # procurando todos os arquivos SAS por extensão (.sas, .sas7bdat,
  # .log, .lst, .cfg, .spk, .egp, .ctp, .amx, .smd, .djf, .ddf,
  # .sas7bpgm, .xpt, .stx).
  # Adicione quantas raízes quiser — ex: /home, /opt/sas, /data
  scan_roots:
    - /

  exclude_patterns:
    - backup
    - archive
    - ".git"
    - __pycache__
    - ".Trash"
    - lost+found

  # Encoding dos arquivos SAS — Latin-1 é comum em SAS 9.4 Linux
  # Opções: utf-8 | latin-1 | iso-8859-1 | cp1252
  file_encoding: latin-1

  # Profundidade máxima de recursão a partir de cada scan_root
  max_scan_depth: 20

# ── Plataforma destino ────────────────────────────────────────
target:
  platform: snowflake
  account: ${SNOWFLAKE_ACCOUNT}
  user: ${SNOWFLAKE_USER}
  password: ${SNOWFLAKE_PASSWORD}
  warehouse: MIGRATION_WH
  database: BMG_MIGRATION
  role: SYSADMIN

  aws:
    region: us-east-1
    s3_bucket: bmg-sas-migration-staging
    s3_prefix: raw/
    iam_role: ${AWS_IAM_ROLE}

# ── Mapeamento de bibliotecas SAS ─────────────────────────────
# Ajustar conforme as LIBNAME definidas nos programas SAS da BMG
library_mapping:
  work:
    database: BMG_MIGRATION
    schema: WORK
  rawdata:
    database: BMG_MIGRATION
    schema: RAW
  dw:
    database: BMG_MIGRATION
    schema: REFINED

# ── Catálogo ─────────────────────────────────────────────────
catalog:
  output_format:
    - json
    - markdown
  detect_pii: true
  infer_domains: true

# ── LLM (opcional) ───────────────────────────────────────────
llm:
  provider: openai
  api_key_env: OPENAI_API_KEY
  models:
    fast: gpt-4o-mini
    balanced: gpt-4o
    powerful: gpt-4o
